[workspace]
resolver = "2"
members = [
    "crates/sd3-core",
    "crates/sd3-dsp",
    "crates/sd3-cli",
    "crates/sd3-plugin",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["open-sd3 contributors"]

[workspace.dependencies]
sd3-core = { path = "crates/sd3-core" }
sd3-dsp = { path = "crates/sd3-dsp" }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
