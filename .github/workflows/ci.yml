name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux-and-sdks:
    name: Rust Workspace, C99/C++17 SDK & Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/X11 build headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust workspace unit & integration tests
        run: cargo test --workspace

      - name: Verify C99 & C++17 single-header SDK compiles cleanly (-Werror)
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror sdk/c/example_inspect_and_decode.c -o /tmp/os3_c99
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -x c++ sdk/c/example_inspect_and_decode.c -o /tmp/os3_cpp17

      - name: Smoke-test C & Python SDKs against synthetic SL-* soundbank
        run: |
          cargo run -p sd3-cli -- gen-demo -o /tmp/demo_bank
          python3 sdk/python/opensd3.py --help >/dev/null
          /tmp/os3_c99 /tmp/demo_bank/SL-OpenSD3Demo/Sounds/soundb1.obw || true

  build-linux-bundles:
    name: Build Linux x86_64 VST3, CLAP, Standalone & CLI
    runs-on: ubuntu-latest
    needs: test-linux-and-sdks
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio/X11 build headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release bundles & binaries
        run: |
          cargo run --package xtask -- bundle open-sd3 --release
          cargo build --release -p sd3-cli -p open-sd3 --bins
          mkdir -p dist-linux
          cp -r target/bundled/open-sd3.vst3 dist-linux/
          cp target/bundled/open-sd3.clap dist-linux/
          cp target/release/open-sd3 dist-linux/
          cp target/release/sd3tool dist-linux/
          tar -czf OpenSD3-Linux-x86_64.tar.gz -C dist-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSD3-Linux-x86_64
          path: OpenSD3-Linux-x86_64.tar.gz

  build-windows-installer:
    name: Cross-Compile Windows x64 VST3/CLAP/Standalone NSIS Setup
    runs-on: ubuntu-latest
    needs: test-linux-and-sdks
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 & NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build Windows x64 Setup (.exe)
        run: ./build-windows-installer.sh ./OpenSD3-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSD3-Windows-x64-Setup
          path: OpenSD3-Windows-x64-Setup.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-bundles, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenSD3-Windows-x64-Setup/OpenSD3-Windows-x64-Setup.exe
            OpenSD3-Linux-x86_64/OpenSD3-Linux-x86_64.tar.gz
